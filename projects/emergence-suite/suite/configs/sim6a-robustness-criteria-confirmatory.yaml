# T4.7 Step B confirmatory criteria (orchestrator, 2026-07-10), preregistered
# BEFORE the confirmatory run. Identical claims and fractions to the pilot
# preregistration; seed-count thresholds scaled 10 -> 20 seeds. The joint
# per-point gate scales in code (0.8 seed fraction). Train/held-out split is
# the first/second half of the seed list, as in the pilot.
criteria:
  - id: S6a.decoupled
    description: "The complete collapse signature survives independently evolving latent depth and depth-independent observation timing in at least 16 of 20 confirmatory seeds."
    metric_path: metrics.decoupled.signature_seed_count
    comparator: ">="
    threshold: 16.0
    weak_threshold: 12.0
    opposite_threshold: 4.0
    kind: success
  - id: A6a.nulls
    description: "Flat, reversed, and non-monotone generative volatility mappings each produce the complete collapse signature in at most 4 of 20 confirmatory seeds."
    metric_path: metrics.nulls.max_signature_seed_count
    comparator: "<="
    threshold: 4.0
    weak_threshold: 6.0
    opposite_threshold: 10.0
    kind: success
  - id: S6a.joint
    description: "At least half of the preregistered 3x3x3x3 joint safety-prior, likelihood-matrix, beta/gamma, and policy-gain grid retains the transition in at least 80 percent of seeds."
    metric_path: metrics.joint.transition_volume_fraction
    comparator: ">="
    threshold: 0.50
    weak_threshold: 0.35
    opposite_threshold: 0.15
    kind: success
  - id: A6a.heldout
    description: "A likelihood fit on the first half of the confirmatory seeds recovers autonomous latent depth on the held-out second half with mean trajectory correlation at least 0.6."
    metric_path: metrics.heldout.mean_truth_correlation
    comparator: ">="
    threshold: 0.60
    weak_threshold: 0.50
    opposite_threshold: 0.20
    kind: success
