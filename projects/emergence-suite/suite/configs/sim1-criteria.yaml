criteria:
  - id: S1.1a
    description: In Arm 1 (closed loop), a connected behaviorally frozen region of at least two cells exists under action-mediated evidence exposure.
    metric_path: criteria.connected_frozen_region_closed_loop
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.1b
    description: In Arm 1 (closed loop), a connected behaviorally revisable region of at least two cells exists under action-mediated evidence exposure.
    metric_path: criteria.connected_revisable_region_closed_loop
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.2
    description: In Arm 1 (closed loop), high-omega/high-kappa cells are not behaviorally frozen after the safe probe.
    metric_path: criteria.high_omega_high_kappa_frozen_rate_closed_loop
    comparator: "<="
    threshold: 0.05
    weak_threshold: 0.10
    opposite_threshold: 0.50
    kind: success
  - id: S1.3
    description: In Arm 1 (closed loop), at least 80 percent of chronic low-omega/low-kappa paths cross the behavioral frozen threshold and the maximum PE on their crossing trials is below the acute closed-loop frozen-region minimum.
    metric_path: criteria.slow_path_crosses_below_acute_min_closed_loop
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.4
    description: In Arm 1 (closed loop), attenuate is selected only in the omega-extreme/kappa-near-zero corner.
    metric_path: criteria.attenuate_corner_only_closed_loop
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.traits
    description: The three formation traits are logged separately by arm and exported in bundle-v3 provenance.
    metric_path: criteria.three_traits_logged
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: A1.1
    description: In Arm 1 (closed loop), an omega-only sweep at moderate kappa does not produce a behaviorally frozen region.
    metric_path: criteria.a11_omega_only_frozen_region_closed_loop
    comparator: "<="
    threshold: 0.0
    weak_threshold: 0.10
    opposite_threshold: 0.50
    kind: adversarial
  - id: A1.2
    description: In Arm 1 (closed loop), the behavioral frozen boundary moves smoothly under CRP concentration plus/minus 50 percent.
    metric_path: criteria.a12_boundary_smoothness_max_jump_closed_loop
    comparator: "<="
    threshold: 0.20
    weak_threshold: 0.30
    opposite_threshold: 0.60
    kind: adversarial
  - id: A1.3
    description: In Arm 1 (closed loop), slow-path trial-order shuffle still crosses the behavioral frozen boundary.
    metric_path: criteria.a13_shuffle_cross_rate_closed_loop
    comparator: ">="
    threshold: 0.80
    weak_threshold: 0.60
    opposite_threshold: 0.20
    kind: adversarial
  - id: A1.4
    description: In Arm 2 (yoked control), at every fixed seed and omega the potential and delivered aversive-evidence counts are exactly identical across all kappa levels.
    metric_path: criteria.a14_yoked_max_count_range
    comparator: "<="
    threshold: 0.0
    weak_threshold: 0.0
    opposite_threshold: 1.0
    kind: adversarial
  - id: A1.5
    description: The number of frozen-region cells in Arm 1 (closed loop) minus Arm 2 (exact replay) is at least the preregistered two-cell margin.
    metric_path: criteria.a15_frozen_region_cell_contrast
    comparator: ">="
    threshold: 2.0
    weak_threshold: 1.0
    opposite_threshold: 0.0
    kind: adversarial
