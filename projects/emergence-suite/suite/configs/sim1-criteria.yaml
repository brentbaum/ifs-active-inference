criteria:
  - id: S1.1a
    description: A connected frozen region exists where the safe probe changes neither the cue's predicted aversive outcome nor approach policy probability beyond the frozen behavior-space threshold.
    metric_path: criteria.connected_frozen_region
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.1b
    description: A connected revisable region exists where the safe probe changes the cue's predicted aversive outcome or approach policy probability beyond the revisable behavior-space threshold.
    metric_path: criteria.connected_revisable_region
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.2
    description: Under yoked high-overwhelm evidence, high-control cells are not behaviorally frozen after the safe probe.
    metric_path: criteria.high_omega_high_kappa_frozen_rate
    comparator: "<="
    threshold: 0.05
    weak_threshold: 0.10
    opposite_threshold: 0.50
    kind: success
  - id: S1.3
    description: The chronic path crosses the behavioral frozen threshold below the acute frozen region's minimum per-trial precision-weighted PE.
    metric_path: criteria.slow_path_crosses_below_acute_min
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.4
    description: Under yoked challenge evidence, attenuate is selected only in the omega-extreme/kappa-near-zero corner.
    metric_path: criteria.attenuate_corner_only
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: S1.traits
    description: Three formation traits are logged as measurements in summary.json.
    metric_path: criteria.three_traits_logged
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.5
    opposite_threshold: 0.0
    kind: success
  - id: A1.1
    description: An omega-only sweep at moderate kappa does not produce a behaviorally frozen region.
    metric_path: criteria.a11_omega_only_frozen_region
    comparator: "<="
    threshold: 0.0
    weak_threshold: 0.10
    opposite_threshold: 0.50
    kind: adversarial
  - id: A1.2
    description: The behavioral frozen boundary moves smoothly under CRP concentration plus/minus 50%.
    metric_path: criteria.a12_boundary_smoothness_max_jump
    comparator: "<="
    threshold: 0.20
    weak_threshold: 0.30
    opposite_threshold: 0.60
    kind: adversarial
  - id: A1.3
    description: Slow-path trial-order shuffle still crosses the behavioral frozen boundary.
    metric_path: criteria.a13_shuffle_cross_rate
    comparator: ">="
    threshold: 0.80
    weak_threshold: 0.60
    opposite_threshold: 0.20
    kind: adversarial
  - id: A1.4
    description: At every fixed seed and omega, aversive-evidence counts are exactly identical across all kappa levels (a stronger check than statistical equality).
    metric_path: criteria.a14_kappa_yoking_max_count_range
    comparator: "<="
    threshold: 0.0
    weak_threshold: 0.0
    opposite_threshold: 1.0
    kind: adversarial
