criteria:
  - id: S4.1a
    description: "EFE-selected contact order is outside-in by readout sequence before deep contact."
    metric_path: metrics.descent.protector_first_ordering_rate
    comparator: ">="
    threshold: 0.85
    weak_threshold: 0.70
    opposite_threshold: 0.40
    kind: success
  - id: S4.1b
    description: "Computed permission crosses before direct contact with the deepest cause."
    metric_path: metrics.descent.permission_precedes_deep_contact_rate
    comparator: ">="
    threshold: 0.90
    weak_threshold: 0.75
    opposite_threshold: 0.50
    kind: success
  - id: S4.1c
    description: "Before the outer relational bank crosses trust threshold, the selected contact is the outer cause."
    metric_path: metrics.descent.outer_choice_before_trust_rate
    comparator: ">="
    threshold: 0.85
    weak_threshold: 0.70
    opposite_threshold: 0.40
    kind: success
  - id: S4.2a
    description: "Forced direct-access probe generates a new cause through CRP spawn conditions."
    metric_path: metrics.thickening.forced_spawn_rate
    comparator: ">="
    threshold: 0.90
    weak_threshold: 0.75
    opposite_threshold: 0.50
    kind: success
  - id: S4.2b
    description: "Forced direct access thickens the stack rather than revising the deepest cause."
    metric_path: metrics.thickening.forced_stack_thickening_rate
    comparator: ">="
    threshold: 0.90
    weak_threshold: 0.75
    opposite_threshold: 0.50
    kind: success
  - id: S4.2c
    description: "Unforced descent does not add another spawned cause."
    metric_path: metrics.thickening.unforced_spawn_rate
    comparator: <=
    threshold: 0.10
    weak_threshold: 0.20
    opposite_threshold: 0.50
    kind: success
  - id: S4.3
    description: "One misattunement setback exceeds five times the immediately preceding attuned-contact gain."
    metric_path: metrics.trust_asymmetry.mean_asymmetry_ratio
    comparator: ">"
    threshold: 5.00
    weak_threshold: 3.50
    opposite_threshold: 1.00
    kind: success
  - id: S4.4a
    description: "Policy-only avoidance yields substantially to practiced counter-conditioning."
    metric_path: metrics.habit_control.habit_practice_drop
    comparator: ">="
    threshold: 0.50
    weak_threshold: 0.35
    opposite_threshold: 0.10
    kind: success
  - id: S4.4b
    description: "The same practice route leaves the protective cause largely unmoved."
    metric_path: metrics.habit_control.protective_practice_drop
    comparator: <=
    threshold: 0.15
    weak_threshold: 0.25
    opposite_threshold: 0.45
    kind: success
  - id: S4.4c
    description: "The protective cause changes under the relational route."
    metric_path: metrics.habit_control.protective_relational_drop
    comparator: ">="
    threshold: 0.40
    weak_threshold: 0.30
    opposite_threshold: 0.10
    kind: success
  - id: S4.5a
    description: "Protective policy banks update from world feedback while mandate/root banks do not."
    metric_path: metrics.methods_not_mission.policy_to_mandate_update_ratio
    comparator: ">="
    threshold: 10.00
    weak_threshold: 5.00
    opposite_threshold: 1.00
    kind: success
  - id: S4.5b
    description: "Mandate/root bank update rate under own operation is zero."
    metric_path: metrics.methods_not_mission.mandate_update_rate
    comparator: "=="
    threshold: 0.00
    weak_threshold: 0.00
    opposite_threshold: 0.10
    kind: success
  - id: A4.1
    description: "Removing relational storage degrades descent ordering to indifference."
    metric_path: metrics.ablation.ordering_degrades_to_indifference
    comparator: "=="
    threshold: 1.00
    weak_threshold: 1.00
    opposite_threshold: 0.00
    kind: adversarial
  - id: A4.2
    description: "EFE audit contains no depth, stack-position, or taxonomy-ordering term."
    metric_path: metrics.audit.efe_audit_no_ordering_terms
    comparator: "=="
    threshold: 1.00
    weak_threshold: 1.00
    opposite_threshold: 0.00
    kind: adversarial
