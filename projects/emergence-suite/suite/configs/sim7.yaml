experiment: sim7
label: pilot
output_dir: ../runs
criteria_path: sim7-criteria.yaml
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]

model_params:
  # Sim 7 world schedule and frozen Step-A readouts.
  adult_trials: 48
  adult_heldout_trials: 12
  therapy_sessions: 96
  posttherapy_heldout_trials: 12
  adult_adversity_probability: 0.68
  adult_trigger_every: 6
  trigger_adversity_probability: 0.90
  posttherapy_safe_probability: 0.82
  adult_write_size: 1.0
  witnessing_write_size: 18.0
  therapy_safe_probability: 0.92
  capture_threshold: 0.30
  melt_capture_drop_threshold: 0.08
  carried_correlation_threshold: -0.25
  adult_capture_rate_threshold: 0.60
  therapy_melt_rate_threshold: 0.60
  h1_loglik_advantage_threshold: 0.02
  h1_win_rate_threshold: 0.70

  # Sim 1 formation/probe constants. The Sim 4 formation call consumes the
  # accepted default Sim 1 machinery; these values define the shared probe.
  assimilation_capacity: 1.0
  disconfirming_trials: 24
  revision_learning_rate: 2.0
  probe_depth_scale: 3.0
  capture_precision_scale: 2.0
  context_precision: 1.0
  tilt_beta: 1.0
  tilt_gamma: 1.2

  # Sim 4 de-authored formation/access. No ordered-access or ID rule appears.
  permission_trust_threshold: 0.72
  relational_prior_count: 1.0
  relational_prior_jitter: 0.25
  contact_write_size: 0.25
  breach_probability: 0.08
  policy_learning_rate: 0.45
  efe_utility_good: 2.2
  efe_utility_bad: -1.15
  efe_utility_catastrophic: -4.8
  efe_information_weight: 5.0
  efe_settled_cost: 1.05

  # Sim 5 learned co-regulation and inferred depth.
  depth_grid: [0.0, 0.25, 0.50, 0.75, 1.0]
  low_baseline_prior: [0.46, 0.28, 0.16, 0.07, 0.03]
  transition_mix: 0.08
  activation_drive: 0.86
  activation_jitter: 0.04
  volatility_precision: 1.35
  coreg_precision: 2.35
  regulated_coreg_by_depth: [0.08, 0.16, 0.36, 0.74, 0.93]
  regulated_surface_coherent_probability: 0.92
  regulated_channel_safe_probability: 0.90
  mapping_settle_probability_by_signal: [0.90, 0.60, 0.64, 0.10]
  mapping_prior_count: 1.0
  mapping_learning_rate: 1.0
