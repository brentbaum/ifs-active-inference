# Sim 8 preregistration (2026-07-10, orchestrator hands-on), written BEFORE the
# first pilot execution. EXPLORATORY register per the sol re-review convention:
# a passing pilot here is a pilot-shaped result and earns only a fresh-seed
# confirmatory cycle, not a claim. Both S8.coupling and S8.descent are earnable
# in either direction — nothing in the mechanism encodes formation order (the
# only id/birth comparisons in Sim8.jl are in the READOUTS).
criteria:
  - id: S8.stacks
    description: "Formation viability: at least 6 of 10 pilot seeds grow two or more causes under the two-crisis schedule (descent is unevaluable otherwise)."
    metric_path: metrics.formation.multi_cause_seed_count
    comparator: ">="
    threshold: 6.0
    weak_threshold: 4.0
    opposite_threshold: 1.0
    kind: success
  - id: S8.coupling_direction
    description: "The grown internal banks are directional: in at least 8 of 10 evaluable seeds, a majority of later/earlier pairs have the later cause expecting catastrophe on the earlier cause's activation more than the reverse. The write rule is symmetric; direction can only come from the world's epoch structure."
    metric_path: metrics.coupling.directional_seed_count
    comparator: ">="
    threshold: 8.0
    weak_threshold: 6.0
    opposite_threshold: 2.0
    kind: success
  - id: S8.descent
    description: "Outside-in therapy ordering emerges: complete newest-to-oldest first-selection in at least 8 of 10 evaluable seeds, with contact selection = draw-toward-pain gated by grown access only (access-weighted writes, no all-or-nothing gate per T4.1c)."
    metric_path: metrics.descent.baseline_pass_count
    comparator: ">="
    threshold: 8.0
    weak_threshold: 6.0
    opposite_threshold: 2.0
    kind: success
  - id: A8.shuffle
    description: "The ordering is carried by the grown coupling: permuting internal banks across pairs degrades descent passes by at least 3 seeds."
    metric_path: metrics.descent.shuffle_degradation
    comparator: ">="
    threshold: 3.0
    weak_threshold: 2.0
    opposite_threshold: 0.0
    kind: adversarial
