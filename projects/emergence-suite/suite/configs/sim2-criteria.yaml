criteria:
  - id: S2.1
    description: "Regimes 1-3 produce less than 10% of witnessing's root revision at matched evidence counts."
    metric_path: metrics.regimes.max_non_witnessing_root_revision_ratio
    comparator: <=
    threshold: 0.10
    weak_threshold: 0.15
    opposite_threshold: 0.50
    kind: success
  - id: S2.2a
    description: "More than 50% of total structural drop occurs inside the registered melt window."
    metric_path: metrics.melt_discreteness.max_drop_fraction_in_window
    comparator: ">"
    threshold: 0.50
    weak_threshold: 0.40
    opposite_threshold: 0.25
    kind: success
  - id: S2.2b
    description: "The melt window is no wider than 10% of the melt phase."
    metric_path: metrics.melt_discreteness.window_fraction
    comparator: <=
    threshold: 0.10
    weak_threshold: 0.15
    opposite_threshold: 0.25
    kind: success
  - id: S2.3a
    description: "Threat and competence banks survive the prune at ordinary structural precision."
    metric_path: metrics.selective_prune.min_bank_precision_survival_ratio
    comparator: ">="
    threshold: 0.95
    weak_threshold: 0.90
    opposite_threshold: 0.70
    kind: success
  - id: S2.3b
    description: "Post-melt compulsive avoidance drops while competence-dependent policy remains available."
    metric_path: metrics.selective_prune.compulsive_avoidance_drop
    comparator: ">="
    threshold: 0.25
    weak_threshold: 0.15
    opposite_threshold: 0.00
    kind: success
  - id: S2.4a
    description: "Premature prompted reduction fails with the full model retained."
    metric_path: metrics.premature_late.early_fail_rate
    comparator: ">="
    threshold: 0.90
    weak_threshold: 0.80
    opposite_threshold: 0.50
    kind: success
  - id: S2.4b
    description: "Late prompted reduction succeeds after witnessed contact accumulates."
    metric_path: metrics.premature_late.late_success_rate
    comparator: ">="
    threshold: 0.90
    weak_threshold: 0.80
    opposite_threshold: 0.50
    kind: success
  - id: S2.4c
    description: "Prompt failure tracks residual accuracy contribution from remaining evidential work."
    metric_path: metrics.premature_late.failure_residual_accuracy_correlation
    comparator: ">="
    threshold: 0.50
    weak_threshold: 0.35
    opposite_threshold: 0.00
    kind: success
  - id: S2.4d
    description: "Prompt failure does not primarily track prompt count."
    metric_path: metrics.premature_late.failure_prompt_count_abs_correlation
    comparator: <=
    threshold: 0.20
    weak_threshold: 0.35
    opposite_threshold: 0.60
    kind: success
  - id: S2.5
    description: "Real-danger control preserves adaptive fear under witnessing."
    metric_path: metrics.real_danger.adaptive_fear_preserved_rate
    comparator: ">="
    threshold: 0.85
    weak_threshold: 0.75
    opposite_threshold: 0.50
    kind: success
  - id: A2.1
    description: "Content-swap matched-precision informational content in the relational slot does not melt."
    metric_path: metrics.content_swap.melt_rate
    comparator: <=
    threshold: 0.10
    weak_threshold: 0.20
    opposite_threshold: 0.50
    kind: adversarial
  - id: A2.2
    description: "One-trial E_t flip changes effective precision only; structural counts are bit-identical."
    metric_path: metrics.et_flip.structural_counts_bit_identical_rate
    comparator: "=="
    threshold: 1.00
    weak_threshold: 1.00
    opposite_threshold: 0.00
    kind: adversarial
  - id: A2.3a
    description: "Melt discreteness survives BMR prior-odds sweep by drop fraction."
    metric_path: metrics.prior_odds_sweep.min_max_drop_fraction_in_window
    comparator: ">"
    threshold: 0.50
    weak_threshold: 0.40
    opposite_threshold: 0.25
    kind: adversarial
  - id: A2.3b
    description: "Melt discreteness survives BMR prior-odds sweep by window width."
    metric_path: metrics.prior_odds_sweep.max_window_fraction
    comparator: <=
    threshold: 0.10
    weak_threshold: 0.15
    opposite_threshold: 0.25
    kind: adversarial
