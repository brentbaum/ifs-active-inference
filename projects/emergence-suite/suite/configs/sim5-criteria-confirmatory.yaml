# T4.4 Step B confirmatory criteria (orchestrator, 2026-07-10), preregistered
# BEFORE the confirmatory run. Identical claims and fractions to the pilot
# preregistration, with seed-count thresholds scaled 10 -> 20 seeds
# (8/10 -> 16/20, 6 -> 12, 2 -> 4, 10 -> 20, 9 -> 18). No other change.
criteria:
  - id: S5.signature
    description: "The learned self-like-part signature orders regulated > fluent-but-threatened > dysregulated by at least 0.15 learned settling probability on both contrasts in at least 16/20 confirmatory seeds."
    metric_path: metrics.learned_mapping.signature_seed_count
    comparator: ">="
    threshold: 16.0
    weak_threshold: 12.0
    opposite_threshold: 4.0
    kind: success
  - id: A5.learned-reversed
    description: "Under the REVERSED contingency mapping, the learned signature reverses to regulated < fluent-but-threatened < dysregulated by the registered margin in at least 16/20 confirmatory seeds."
    metric_path: metrics.learned_mapping.reversed_signature_seed_count
    comparator: ">="
    threshold: 16.0
    weak_threshold: 12.0
    opposite_threshold: 4.0
    kind: adversarial
  - id: A5.learned-unreliable
    description: "With 75% outcome noise toward chance, the regulated-to-dysregulated learned-mapping span is at most 60% of its reliable counterpart in at least 16/20 confirmatory seeds."
    metric_path: metrics.learned_mapping.unreliable_degraded_seed_count
    comparator: ">="
    threshold: 16.0
    weak_threshold: 12.0
    opposite_threshold: 4.0
    kind: adversarial
  - id: S5.2-lesion
    description: "A real mid-run lesion resets learned co-regulation Dirichlet counts and blocks subsequent mapping writes; the fluent signal's tail estimate moves at least halfway back toward chance in at least 16/20 confirmatory seeds."
    metric_path: metrics.learned_mapping.lesion_degraded_seed_count
    comparator: ">="
    threshold: 16.0
    weak_threshold: 12.0
    opposite_threshold: 4.0
    kind: adversarial
  - id: A5.2-live
    description: "Regulation-only has contact-generated relational root evidence in all 20 confirmatory seeds, so its contrast with regulation-plus-witnessing is live rather than content-gated. The direction is reported, not threshold-selected."
    metric_path: metrics.adversarial.regulation_only_contact_root_evidence_seed_count
    comparator: "=="
    threshold: 20.0
    weak_threshold: 18.0
    opposite_threshold: 0.0
    kind: adversarial
  - id: S5.emissions
    description: "Regulated, fluent-but-threatened, and dysregulated use three distinct preregistered joint emission tuples."
    metric_path: metrics.audit.distinct_emission_tuple_count
    comparator: "=="
    threshold: 3.0
    weak_threshold: 3.0
    opposite_threshold: 1.0
    kind: success
  - id: S5.trace
    description: "The client capture figure and posterior trace are written for the learned-mapping pilot."
    metric_path: metrics.outputs.capture_figure_written
    comparator: "=="
    threshold: 1.0
    weak_threshold: 1.0
    opposite_threshold: 0.0
    kind: success
  - id: S5.audit
    description: "Condition labels do not enter the co-regulation likelihood; learned contingency counts do."
    metric_path: metrics.audit.supplied_condition_labels_used_as_likelihood
    comparator: "=="
    threshold: 0.0
    weak_threshold: 0.0
    opposite_threshold: 1.0
    kind: success

# Falsified/superseded originals are retained verbatim enough to preserve the
# preregistration record. They are intentionally outside `criteria` because the
# Step A evaluator should grade the corrected experiment, not count known aliases.
falsified_originals:
  - id: S5.1b
    original_description: "Regulated dyad root revision exceeds fluent-but-threatened revision by the preregistered margin with identical words."
    original_metric_path: metrics.revision.regulated_minus_fluent_threatened
    original_comparator: ">="
    original_threshold: 8.0
    status: FALSIFIED
    reason: "The original fluent-but-threatened condition was an exact alias of dysregulated."
  - id: S5.2
    original_description: "Ablating the fluent-but-threatened regulation channel to the regulated distribution makes it approximate the regulated condition."
    original_metric_path: metrics.ablation.fluent_regulation_ablation_relative_gap
    original_comparator: "<="
    original_threshold: 0.15
    status: FALSIFIED
    reason: "The original ablation was the regulated condition renamed, not an intervention."
  - id: A5.2b
    original_description: "Regulation-only therapist produces at least a partial root-revision effect if the model grants revision without words."
    original_metric_path: metrics.adversarial.regulation_only_revision_ratio
    original_comparator: ">="
    original_threshold: 0.10
    status: STRUCTURALLY_UNEARNABLE_IN_ORIGINAL
    reason: "CONTENT_NONE wrote exactly zero root evidence; T4.4 makes every realized contact generate relational root evidence."
