criteria:
  - id: S3.training_parity
    description: H1 and H2 treated-cue training log-evidence differ by less than epsilon before probes are interpreted.
    metric_path: metrics.training_parity.abs_log_evidence_diff
    comparator: "<="
    threshold: 0.05
    weak_threshold: 0.08
    opposite_threshold: 0.12
    kind: success
  - id: S3.2.cascade_witnessing
    description: Witnessing seeds show self-state first passage before threat meaning before policy in more than 90 percent of seeds.
    metric_path: metrics.cascade.witnessing_order_rate
    comparator: ">"
    threshold: 0.90
    weak_threshold: 0.80
    opposite_threshold: 0.50
    kind: success
  - id: S3.2.no_exposure_order
    description: Matched exposure does not show a consistent self-to-threat-to-policy first-passage order.
    metric_path: metrics.cascade.exposure_order_rate
    comparator: "<="
    threshold: 0.60
    weak_threshold: 0.70
    opposite_threshold: 0.85
    kind: success
  - id: S3.transfer.h1_witnessing_gradient
    description: H1 witnessing produces a monotone transfer gradient across root-sharing continuum cues.
    metric_path: metrics.transfer.h1_witnessing_monotone_gradient
    comparator: ">="
    threshold: 1.0
    weak_threshold: 0.75
    opposite_threshold: 0.25
    kind: success
  - id: S3.transfer.witnessing_vs_exposure
    description: H1 witnessing transfer exceeds matched exposure by the preregistered effect size.
    metric_path: metrics.transfer.h1_witnessing_minus_exposure_mean
    comparator: ">="
    threshold: 0.20
    weak_threshold: 0.12
    opposite_threshold: 0.05
    kind: success
  - id: S3.transfer.witnessing_vs_h2
    description: H1 witnessing transfer exceeds H2 by the preregistered effect size.
    metric_path: metrics.transfer.h1_witnessing_minus_h2_mean
    comparator: ">="
    threshold: 0.20
    weak_threshold: 0.12
    opposite_threshold: 0.05
    kind: success
  - id: S3.transfer.exposure_flat
    description: Matched exposure remains cue-bound with a low continuum slope.
    metric_path: metrics.transfer.exposure_abs_slope
    comparator: "<="
    threshold: 0.10
    weak_threshold: 0.15
    opposite_threshold: 0.25
    kind: success
  - id: S3.transfer.h2_flat
    description: H2 control remains cue-bound with a low continuum slope.
    metric_path: metrics.transfer.h2_abs_slope
    comparator: "<="
    threshold: 0.10
    weak_threshold: 0.15
    opposite_threshold: 0.25
    kind: success
  - id: S3.leakage.untrained_threat_banks
    description: Untrained cue-local threat banks remain statistically unchanged.
    metric_path: metrics.leakage.max_untrained_threat_l1_shift
    comparator: "<="
    threshold: 0.05
    weak_threshold: 0.08
    opposite_threshold: 0.12
    kind: success
  - id: S3.3.eta_self_zero_kills_transfer
    description: Setting eta_self to zero collapses the witnessing transfer signature.
    metric_path: metrics.ablations.eta_self_zero_transfer_drop
    comparator: ">="
    threshold: 0.18
    weak_threshold: 0.10
    opposite_threshold: 0.03
    kind: success
  - id: S3.3.eta_threat_zero_preserves_signature
    description: Setting eta_threat to zero does not kill the witnessing transfer signature.
    metric_path: metrics.ablations.eta_threat_zero_transfer_ratio
    comparator: ">="
    threshold: 0.80
    weak_threshold: 0.65
    opposite_threshold: 0.40
    kind: success
  - id: S3.1.emergent_sigmoid_readout
    description: Transfer as a function of E_t has a preregistered sigmoid-shaped readout without any sigmoid function in model code.
    metric_path: metrics.e_t_readout.shape_score
    comparator: ">="
    threshold: 0.80
    weak_threshold: 0.65
    opposite_threshold: 0.40
    kind: success
  - id: A3.1.fake_content_kills_transfer
    description: Replacing self evidence with threat evidence prevents the transfer signature.
    metric_path: metrics.adversarial.fake_content_transfer_drop
    comparator: ">="
    threshold: 0.18
    weak_threshold: 0.10
    opposite_threshold: 0.03
    kind: adversarial
  - id: A3.1.counterbalanced_reversal
    description: Training and probing on counterbalanced cues preserves the transfer signature.
    metric_path: metrics.adversarial.counterbalanced_transfer_gap
    comparator: ">="
    threshold: 0.18
    weak_threshold: 0.10
    opposite_threshold: 0.03
    kind: adversarial
  - id: A3.1.real_danger_probe
    description: In a real-danger probe, adaptive avoidance remains high after witnessing.
    metric_path: metrics.adversarial.real_danger_avoidance
    comparator: ">="
    threshold: 0.75
    weak_threshold: 0.65
    opposite_threshold: 0.40
    kind: adversarial
  - id: A3.1.sensitivity_sweep
    description: The transfer signature survives preregistered local perturbations of learning and precision parameters.
    metric_path: metrics.adversarial.sensitivity_support_rate
    comparator: ">="
    threshold: 0.75
    weak_threshold: 0.60
    opposite_threshold: 0.35
    kind: adversarial
  - id: A3.1.matched_fit_verification
    description: H1 and H2 dog-training trajectories remain matched, not only final evidence.
    metric_path: metrics.adversarial.training_trajectory_gap
    comparator: "<="
    threshold: 0.08
    weak_threshold: 0.12
    opposite_threshold: 0.20
    kind: adversarial
  - id: A3.2.structural_confound
    description: Perceptually near but root-distant confound transfers less than a perceptually distant root-sharing cue.
    metric_path: metrics.adversarial.structural_confound_gap
    comparator: ">="
    threshold: 0.15
    weak_threshold: 0.08
    opposite_threshold: 0.00
    kind: adversarial
