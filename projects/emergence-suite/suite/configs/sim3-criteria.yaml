criteria:
  - id: S3.training_parity_stop
    description: H1 and H2 in-sample training-cue mean log likelihoods are matched before transfer probes are interpreted.
    metric_path: metrics.training_parity.abs_mean_log_likelihood_diff
    comparator: "<="
    threshold: 0.05
    weak_threshold: 0.08
    opposite_threshold: 0.12
    kind: success

  - id: S3.model_comparison.heldout_h1_advantage
    description: With training banks frozen, H1 predicts held-out training-cue outcomes better than the live reversed-direction H2 competitor.
    metric_path: metrics.out_of_sample.h1_minus_h2_mean_log_likelihood
    comparator: ">="
    threshold: 0.01
    weak_threshold: 0.00
    opposite_threshold: -0.02
    kind: success

  - id: S3.cascade.honest_witnessing_order
    description: At integer trial resolution, witnessing produces strict self-before-threat-before-policy crossings in at least 8 of 10 pilot seeds; same-trial crossings do not count.
    metric_path: metrics.cascade.witnessing_earned_count
    comparator: ">="
    threshold: 8
    weak_threshold: 6
    opposite_threshold: 3
    kind: success

  - id: S3.cascade.witnessing_ties
    description: Same-trial witnessing crossings are reported separately and remain uncommon rather than being credited as ordered cascades.
    metric_path: metrics.cascade.witnessing_tie_count
    comparator: "<="
    threshold: 2
    weak_threshold: 4
    opposite_threshold: 7
    kind: adversarial

  - id: S3.cascade.two_way_self_before_threat
    description: "Step B amendment (2026-07-10, orchestrator, pre-confirmatory): policy is a deterministic readout of current beliefs in this model, so the three-way strict cascade is structurally unearnable (threat and policy cross together by construction); it is retained above for the record. The evidential cascade claim at this model scale is identity-before-threat: witnessing produces strictly earlier self-state crossings than threat crossings (trial resolution, no offsets) in at least 8 of 10 seeds."
    metric_path: metrics.cascade.witnessing_self_before_threat_count
    comparator: ">="
    threshold: 8
    weak_threshold: 6
    opposite_threshold: 3
    kind: success

  - id: S3.cascade.two_way_exposure_control
    description: "Step B amendment: matched exposure does not produce the self-before-threat ordering in a majority of seeds."
    metric_path: metrics.cascade.exposure_self_before_threat_count
    comparator: "<="
    threshold: 5
    weak_threshold: 6
    opposite_threshold: 8
    kind: success

  - id: S3.cascade.two_way_h2_control
    description: "Step B amendment: the reversed-root architecture does not produce the self-before-threat ordering in a majority of seeds."
    metric_path: metrics.cascade.h2_self_before_threat_count
    comparator: "<="
    threshold: 5
    weak_threshold: 6
    opposite_threshold: 8
    kind: success

  - id: S3.cascade.exposure_control
    description: Low-depth exposure does not produce the strict cascade in a majority of seeds.
    metric_path: metrics.cascade.exposure_earned_count
    comparator: "<="
    threshold: 5
    weak_threshold: 6
    opposite_threshold: 8
    kind: success

  - id: S3.transfer.learned_association_correlation
    description: Across held agent banks and untrained cues, the transfer gradient positively tracks each agent's learned cue-to-root association rather than a supplied cue coefficient.
    metric_path: metrics.transfer.learned_association_contact_correlation
    comparator: ">="
    threshold: 0.70
    weak_threshold: 0.50
    opposite_threshold: 0.00
    kind: success

  - id: S3.transfer.learned_association_partial
    description: Learned cue-to-root association remains positively related to contact after controlling for perceptual similarity.
    metric_path: metrics.transfer.learned_association_partial_correlation
    comparator: ">="
    threshold: 0.50
    weak_threshold: 0.30
    opposite_threshold: 0.00
    kind: adversarial

  - id: S3.transfer.witnessing_vs_exposure
    description: Mean untrained-cue contact after witnessing exceeds matched low-depth exposure.
    metric_path: metrics.transfer.h1_witnessing_minus_exposure_mean
    comparator: ">="
    threshold: 0.12
    weak_threshold: 0.07
    opposite_threshold: 0.00
    kind: success

  - id: A3.2.perceptual_threat_channel_live
    description: The perceptually near but root-poor cue receives positive generalized safe-threat evidence from feature overlap.
    metric_path: metrics.perceptual_generalization.root_poor_threat_safe_gain
    comparator: ">="
    threshold: 0.03
    weak_threshold: 0.015
    opposite_threshold: 0.00
    kind: adversarial

  - id: A3.2.witnessing_exceeds_perceptual
    description: The preregistered low-perceptual root-associated cue transfers more than the perceptually near root-poor cue, despite a live perceptual channel.
    metric_path: metrics.perceptual_generalization.structural_cue_minus_root_poor_perceptual_contact
    comparator: ">="
    threshold: 0.08
    weak_threshold: 0.04
    opposite_threshold: 0.00
    kind: adversarial

  - id: A3.2.perceptual_inference_is_cue_bound
    description: Perceptual sharing is an inference-time stimulus-generalization message and does not mutate untrained cue-local threat banks.
    metric_path: metrics.perceptual_generalization.max_untrained_threat_bank_l1_shift
    comparator: "<="
    threshold: 0.000000001
    weak_threshold: 0.000001
    opposite_threshold: 0.01
    kind: adversarial

  - id: S3.h2.self_learning_live
    description: H2's shared self bank changes downstream of its learned threat state in either direction; self learning is not disabled.
    metric_path: metrics.h2_liveness.self_bank_absolute_shift
    comparator: ">="
    threshold: 0.02
    weak_threshold: 0.01
    opposite_threshold: 0.00
    kind: adversarial

  - id: S3.h2.threat_learning_live
    description: H2's trained cue-local threat bank learns substantially from relational and outcome evidence.
    metric_path: metrics.h2_liveness.trained_threat_safe_shift
    comparator: ">="
    threshold: 0.15
    weak_threshold: 0.10
    opposite_threshold: 0.00
    kind: adversarial
