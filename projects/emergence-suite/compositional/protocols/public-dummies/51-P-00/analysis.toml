contract_id = "ifs-ai-experiment-51-contract"
contract_version = "1.0.1"
analysis_id = "public-contract-dummy"
unit_of_analysis = "seed"
tie_handling = "pass"
non_crossing = "horizon_plus_one"
missing_cells = "fail"
non_finite = "fail"

[[estimands]]
id = "budget-match"
status = "audit"
hypothesis_provenance = "development"
expression = { op = "max", arg = { op = "budget_relative_error", evidence_budget_rule_id = "dummy-budget" } }
aggregation = "identity"
interval = { method = "none" }
control_ids = ["broadcast-budget-control"]

[[estimands]]
id = "depth-difference"
status = "descriptive"
hypothesis_provenance = "development"
expression = { op = "arm_difference", value = { op = "terminal", arg = { op = "field", path = "state.global_precision.global-main.depth" } }, treatment = "broadcast-on", control = "broadcast-off" }
aggregation = "mean"
interval = { method = "percentile_bootstrap", level = 0.95, resamples = 1000 }
control_ids = ["broadcast-capacity-control", "broadcast-budget-control"]

[[estimands]]
id = "access-before-root"
status = "audit"
hypothesis_provenance = "theory"
expression = { op = "event_precedes", left = { op = "first_crossing", arg = { op = "field", path = "state.access.access-main.probability" }, comparator = "ge", threshold = 0.70, persistence = 2 }, right = { op = "first_crossing", arg = { op = "field", path = "state.bundle.bundle-main.root_probability" }, comparator = "ge", threshold = 0.70, persistence = 2 } }
aggregation = "rate"
interval = { method = "exact_binomial", level = 0.95 }
control_ids = []

[[decision_rules]]
id = "budget-valid"
estimand_id = "budget-match"
comparator = "le"
threshold = 0.01
interval_requirement = "none"

[[decision_rules]]
id = "ordering-observed"
estimand_id = "access-before-root"
comparator = "ge"
threshold = 0.50
interval_requirement = "none"
