time = 22
kind = "probe"
source = "world"
channel_id = "cue-signal"
emission_id = "cue-emission"
repeat = 1
interval = 1

[[arms.events]]
id = "replay-stop"
time = 23
kind = "stop_check"
source = "intervention"
stopping_rule_id = "development-horizon"

[[paired_streams]]
id = "closed-replay-pair"
arms = ["closed-loop", "exact-replay"]
components = [
  { kind = "latent_factor", id = "partner-state" },
  { kind = "latent_factor", id = "episode-state" },
  { kind = "latent_factor", id = "exposure-state" },
  { kind = "process", id = "partner-process" },
  { kind = "process", id = "episode-process" },
  { kind = "process", id = "exposure-process" },
  { kind = "emission", id = "episode-emission" },
  { kind = "emission", id = "cue-emission" },
  { kind = "outcome", id = "approach-outcome" },
  { kind = "outcome", id = "potential-hazard" }
]

[[stopping_rules]]
id = "development-horizon"
kind = "fixed_horizon"
max_time = 23

[[evidence_budget_rules]]
id = "closed-replay-budget"
arms = ["closed-loop", "exact-replay"]
arm_pairs = [{ left = "closed-loop", right = "exact-replay" }]
metric = "delivered_log_likelihood_abs"
scope = ["bundle-main"]
tolerance_fraction = 0.01

[[controls]]
id = "exact-replay-control"
kind = "matched_capacity"
treatment_arms = ["closed-loop"]
control_arms = ["exact-replay"]
intervention_ids = ["enable-success-transition"]
budget_rule_ids = []

[[controls]]
id = "closed-replay-budget-control"
kind = "matched_budget"
treatment_arms = ["closed-loop"]
control_arms = ["exact-replay"]
intervention_ids = []
budget_rule_ids = ["closed-replay-budget"]
