[[arms.events]]
id = "closed-disable-observe"
time = 0
kind = "intervene"
source = "intervention"
intervention_id = "disable-observe"

[[arms.events]]
id = "closed-episode-stream"
time = 1
kind = "observe"
source = "world"
channel_id = "episode-signal"
emission_id = "episode-emission"
repeat = 20
interval = 1

[[arms.events]]
id = "closed-corrective-probe"
time = 22
kind = "probe"
source = "world"
channel_id = "cue-signal"
emission_id = "cue-emission"
repeat = 1
