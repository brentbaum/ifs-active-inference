<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>$title$</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      margin: 2rem auto;
      max-width: 48rem;
      line-height: 1.5;
      color: #111;
    }
    h1, h2, h3, h4 {
      font-family: Helvetica, Arial, sans-serif;
      line-height: 1.2;
      margin-top: 1.5rem;
    }
    p {
      margin: 0.75rem 0;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid #999;
      padding: 0.45rem;
      vertical-align: top;
      text-align: left;
    }
    .paper-date {
      color: #555;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <h1>$title$</h1>
  <p class="paper-date">$date$</p>
  $body$
</body>
</html>
